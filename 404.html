<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — AnarchyOrigin</title>
<link rel="icon" type="image/png" href="https://github.com/RHVHV/about.anarchyorigin.com/releases/download/v1.0.0/icon-server.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #08080d;
    color: #f0f0f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(230,92,0,0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(249,168,37,0.05) 0%, transparent 40%);
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .wrap {
    text-align: center;
    max-width: 480px;
    width: 100%;
  }

  .logo {
    width: 72px;
    height: 72px;
    margin: 0 auto 32px;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(230,92,0,0.35);
    background: #0d0d14;
  }

  .logo img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }

  .num {
    font-size: 120px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.06em;
    color: #ff8c42;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 14px;
    letter-spacing: -0.02em;
  }

  p {
    color: #9a9aa8;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .link {
    display: block;
    padding: 14px 20px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    color: #f0f0f5;
    transition: border-color 0.25s ease, color 0.25s ease;
  }

  .link:hover {
    border-color: rgba(230,92,0,0.5);
    color: #f9a825;
  }

  .link span {
    color: #6a6a78;
    margin-right: 8px;
  }

  .note {
    margin-top: 32px;
    font-size: 12px;
    color: #6a6a78;
    font-family: 'JetBrains Mono', monospace;
  }

  @media (max-width: 480px) {
    .num { font-size: 96px; }
    .logo { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="logo">
    <img src="https://github.com/RHVHV/about.anarchyorigin.com/releases/download/v1.0.0/icon-server.png" alt="AnarchyOrigin">
  </div>

  <div class="num">404</div>
  <h1>Страница не найдена</h1>
  <p>По этому адресу ничего нет. Возможно, ссылка устарела или в ней опечатка.</p>

  <div class="links">
    <a class="link" href="/"><span>→</span>На главную</a>
    <a class="link" href="https://anarchyorigin.com"><span>→</span>Основной сайт</a>
  </div>

  <div class="note">AnarchyOrigin</div>
</div>

</body>
</html>
