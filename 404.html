<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена — AnarchyOrigin</title>
<link rel="icon" type="image/png" href="https://github.com/RHVHV/about.anarchyorigin.com/releases/download/v1.0.0/icon-server.png">
<link rel="apple-touch-icon" href="https://github.com/RHVHV/about.anarchyorigin.com/releases/download/v1.0.0/icon-server.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600&family=Unbounded:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --o1: #e65c00;
    --o2: #f9a825;
    --o3: #ff8c42;
    --bg: #08080d;
    --card: rgba(255,255,255,0.03);
    --line: rgba(255,255,255,0.08);
    --line-accent: rgba(230,92,0,0.35);
    --t1: #f0f0f5;
    --t2: #9a9aa8;
    --t3: #6a6a78;
    --green: #22c55e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--t1);
    line-height: 1.65;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  a, button, div, span, h1, h2, h3, p, svg, img { -webkit-tap-highlight-color: transparent; }
  a, button { -webkit-touch-callout: none; }
  a:focus, button:focus, div:focus, a:active, button:active, div:active { outline: none; -webkit-tap-highlight-color: transparent; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--o3); outline-offset: 2px; }
  ::selection { background: rgba(230,92,0,0.3); color: #fff; }
  ::-moz-selection { background: rgba(230,92,0,0.3); color: #fff; }

  body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background:
      radial-gradient(circle at 20% 20%, rgba(230,92,0,0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(249,168,37,0.05) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
    animation: ambient 20s ease-in-out infinite alternate;
  }

  @keyframes ambient {
    0% { transform: translate(0,0) scale(1); }
    100% { transform: translate(-2%,-2%) scale(1.05); }
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 600px;
  }

  .icon {
    width: 96px;
    height: 96px;
    margin: 0 auto 28px;
    border-radius: 24px;
    overflow: hidden;
    border: 1px solid rgba(230,92,0,0.4);
    box-shadow: 0 0 60px rgba(230,92,0,0.35), 0 0 120px rgba(230,92,0,0.15);
    background: #0d0d14;
    animation: floatIcon 6s ease-in-out infinite;
  }

  @keyframes floatIcon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .icon img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .code-404 {
    font-family: 'Unbounded', 'Inter', sans-serif;
    font-size: clamp(80px, 20vw, 180px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.08em;
    background: linear-gradient(135deg, #fff 0%, #ff8c42 55%, #e65c00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 16px;
    padding-bottom: 0.05em;
  }

  h1 {
    font-size: clamp(24px, 5vw, 36px);
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1.15;
    margin-bottom: 16px;
    padding-bottom: 0.05em;
  }

  p {
    color: var(--t2);
    font-size: clamp(15px, 2.2vw, 18px);
    max-width: 500px;
    margin: 0 auto 36px;
  }

  .actions {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 28px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line-accent);
    border-radius: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    color: var(--o2);
    transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
    position: relative;
  }

  .btn:hover {
    border-color: var(--o2);
    box-shadow: 0 0 40px rgba(230,92,0,0.35);
    transform: translateY(-3px);
  }

  .btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }

  @media (max-width: 600px) {
    .icon { width: 76px; height: 76px; border-radius: 20px; }
    .btn { padding: 14px 22px; font-size: 13px; width: 100%; justify-content: center; }
    .actions { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>

<div class="content">
  <div class="icon">
    <img src="https://github.com/RHVHV/about.anarchyorigin.com/releases/download/v1.0.0/icon-server.png" alt="AnarchyOrigin">
  </div>
  <div class="code-404">404</div>
  <h1>Страница не найдена</h1>
  <p>Такой страницы на сервере нет. Возможно, ссылка устарела или вы ошиблись в адресе.</p>
  <div class="actions">
    <a href="https://about.anarchyorigin.com" class="btn">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      На главную
    </a>
    <a href="https://anarchyorigin.com" class="btn">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Основной сайт
    </a>
  </div>
</div>

</body>
</html>
